server:
  port: ${SERVER_PORT:8102}

logging:
  level:
    com.arcadiaeditions.catalog.inventory: DEBUG
    org.apache.kafka.clients.admin: WARN

springdoc.swagger-ui.urls:
  - name: Arcadia Editions - Catalog Inventory Service
    url: /apis/openapi.yml

management:
  endpoints.web.exposure.include: "*"

spring:
  # transactional outbox (docs/adr/0003): event_publication table created at startup (main and tests),
  # events not yet sent to Kafka are sent again on restart
  modulith.events:
    jdbc.schema-initialization.enabled: true
    republish-outstanding-events-on-restart: true
  security:
    user:
      name: admin
      password: password
      roles: USER
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
  cloud:
    stream:
      kafka.binder.enable-observation: true
      function:
        definition: on-customer-event;
      bindings:
        on-customer-event-out:
          destination: customer.events

# synchronous calls to other services: see docs/backlog/http-clients.md
arcadia:
  clients:
    payments-processing:
      base-url: ${PAYMENTS_PROCESSING_URL:http://localhost:8103/api}
      username: ${PAYMENTS_PROCESSING_USERNAME:admin}
      password: ${PAYMENTS_PROCESSING_PASSWORD:password}
